name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regenerate the HTML from content.py so the published site can never
      # drift from the content model, whatever is committed.
      - name: Build
        run: python3 build.py

      # Stage only what should be public. Keeps .git, the workflow and the
      # generator out of the served directory.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp *.html _site/
          cp CNAME robots.txt sitemap.xml .nojekyll _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
